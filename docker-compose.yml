name: jav-metadata-syncer

services:
  syncer:
    build: .
    image: jav-metadata-syncer:latest
    container_name: jav-metadata-syncer
    restart: unless-stopped
    ports:
      - "7712:7712"
    volumes:
      - ./data:/app/data       # persists runtime settings written via /api/settings
      - ./output:/app/output   # Emby 電影資料夾輸出（movie.nfo + 圖片）
    environment:
      # These env vars seed the initial defaults. Anything saved through the
      # UI later overrides them and persists across container restarts.
      ENABLED_SOURCES: "javbus,javtrailers,missav"
      CORS_ORIGINS: "*"
      TZ: Asia/Taipei
